[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelabctl"
version = "0.1.0"
description = "Terminal home lab configuration and inspection system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
homelabctl = "homelabctl.cli:main"
homelabd = "homelabctl.backend.daemon:main"
homelabctl-apply = "homelabctl.apply.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homelabctl = [
    "tui/*.tcss",
    "templates/ssh/*.j2",
    "templates/nftables/*.j2",
    "templates/logind/*.j2",
    "templates/modprobe/*.j2",
    "templates/systemd/*.j2",
    "templates/udev/*.j2",
    "templates/power/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
